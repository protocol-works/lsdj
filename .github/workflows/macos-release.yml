name: Release

run-name: Release ${{ github.ref_name }} by @${{ github.actor }}

# A protected release tag starts validation. Signing credentials remain behind
# each platform release Environment's separate human approval gate.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'protocol-works/lsdj' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.release_identity.outputs.revision }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and ancestry
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]] || {
            echo "Release tag must look like v2026.08.1" >&2
            exit 1
          }

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main || {
            echo "Release tag does not point to a commit contained in main" >&2
            exit 1
          }

          echo "Validated $GITHUB_REF_NAME at $TAG_COMMIT"
          echo "revision=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

  produce_macos:
    name: Produce macOS arm64 artifact
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.repository == 'protocol-works/lsdj' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 180

    # This Environment allows only v* tags, requires an Engineering approval,
    # permits the initiating Engineering member to approve their own release,
    # and disallows administrator bypass. Its secrets are withheld until the
    # explicit approval and all other rules pass.
    environment:
      name: macos-release

    defaults:
      run:
        shell: bash

    steps:
      # Official GitHub actions are pinned to immutable commits so a moved tag
      # cannot introduce new code into this secret-bearing job.
      - name: Check out the approved release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Check runner architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "LSDJ releases require an Apple Silicon runner" >&2
            exit 1
          }

      # These operations run before any signing or notarization secret is
      # materialized on the runner.
      - name: Install build tools and dependencies
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          brew install just uv
          cargo install tauri-cli --version '=2.11.2' --locked
          npm ci --prefix frontend

      - name: Freeze production backend
        run: |
          set -euo pipefail
          # The runner's /Library/Frameworks Python becomes a symlinked
          # Python.framework in PyInstaller ONEDIR output. Tauri dereferences
          # resource symlinks, invalidating that framework after signing. Use
          # uv's standalone distribution so the bundle contains libpython.
          uv sync --project backend --frozen --managed-python --python 3.13
          just freeze-backend
          test -x src-tauri/sidecar-dist/lsdj_backend/lsdj_backend
          test -d src-tauri/sidecar-dist/lsdj_backend/_internal
          test -f src-tauri/sidecar-dist/lsdj_backend/_internal/libpython3.13.dylib
          test ! -e src-tauri/sidecar-dist/lsdj_backend/_internal/Python.framework
          test ! -L src-tauri/sidecar-dist/lsdj_backend/_internal/Python.framework
          src-tauri/sidecar-dist/lsdj_backend/lsdj_backend --help >/dev/null
          src-tauri/sidecar-dist/lsdj_backend/lsdj_backend \
            --generation-server --help >/dev/null
          src-tauri/sidecar-dist/lsdj_backend/lsdj_backend --check-runtime

      - name: Import Developer ID certificate into an ephemeral Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/lsdj-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo "LSDJ_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "LSDJ_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"

          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 10800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$({ security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true; } \
            | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          test -n "$SIGNING_IDENTITY" || {
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          }
          [[ "$SIGNING_IDENTITY" == *" (A293544336)" ]] || {
            echo "Developer ID identity does not belong to Apple team A293544336" >&2
            exit 1
          }

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Materialize notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_VALUE"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "LSDJ_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and verify DMG
        env:
          LSDJ_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          just tauri-release

      - name: Package verified release artifact
        env:
          LSDJ_RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMG_FILES=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ "${#DMG_FILES[@]}" -eq 1 ]] || {
            echo "Expected exactly one verified DMG, found ${#DMG_FILES[@]}" >&2
            exit 1
          }

          python scripts/release_artifact.py create \
            --producer macos-arm64 \
            --release-tag "$GITHUB_REF_NAME" \
            --revision "$LSDJ_RELEASE_REVISION" \
            --asset "${DMG_FILES[0]}" \
            --output-dir release-artifacts/macos-arm64

      # The publisher receives installers only through immutable per-run
      # Actions artifacts, together with the tag/revision metadata and digest.
      - name: Upload verified producer bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: release-artifacts/macos-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          set +e
          if [[ -n "${LSDJ_KEYCHAIN_PATH:-}" && -f "$LSDJ_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$LSDJ_KEYCHAIN_PATH"
          fi
          rm -f \
            "${LSDJ_CERTIFICATE_PATH:-}" \
            "${LSDJ_API_KEY_PATH:-}"

  produce_windows:
    name: Produce Windows x64 artifact
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      github.repository == 'protocol-works/lsdj' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 180

    # This protected Environment must require a separate human approval. The
    # provider-specific identity provisioning step cannot be selected until the
    # project chooses an Authenticode provider. These public identity values and
    # the credentialed wrapper path stay unavailable before approval.
    environment:
      name: windows-release

    env:
      LSDJ_WINDOWS_SIGN_COMMAND_PATH: ${{ vars.WINDOWS_SIGN_COMMAND_PATH }}
      LSDJ_WINDOWS_EXPECTED_CERTIFICATE_SHA1: ${{ vars.WINDOWS_EXPECTED_CERTIFICATE_SHA1 }}
      LSDJ_WINDOWS_EXPECTED_SUBJECT: ${{ vars.WINDOWS_EXPECTED_SUBJECT }}

    steps:
      - name: Check out the approved release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install build tools and frontend dependencies
        shell: pwsh
        run: |
          cargo install tauri-cli --version '=2.11.2' --locked
          npm ci --prefix frontend
          npm run build --prefix frontend

      # The selected provider must insert a protected provisioning step before
      # this preflight (for example, federated identity or an HSM-backed client).
      # Until that reviewed decision exists, this job intentionally fails here.
      - name: Require protected Authenticode identity
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Preflight

      - name: Build, sign, timestamp, and verify NSIS installer
        id: windows_build
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -ReleaseTag $env:GITHUB_REF_NAME -Release

      - name: Verify installed executable payloads and uninstall behavior
        shell: pwsh
        run: >-
          ./scripts/verify-windows-release-install.ps1
          -Installer '${{ steps.windows_build.outputs.installer }}'
          -ExpectedVersion '${{ steps.windows_build.outputs.version }}'

      - name: Package verified release artifact
        shell: pwsh
        env:
          LSDJ_RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        run: >-
          python scripts/release_artifact.py create
          --producer windows-x64
          --release-tag "$env:GITHUB_REF_NAME"
          --revision "$env:LSDJ_RELEASE_REVISION"
          --asset '${{ steps.windows_build.outputs.installer }}'
          --output-dir release-artifacts/windows-x64

      - name: Upload verified producer bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: release-artifacts/windows-x64
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and publish complete release
    needs:
      - validate
      - produce_macos
      - produce_windows
    if: >-
      needs.validate.result == 'success' &&
      needs.produce_macos.result == 'success' &&
      needs.produce_windows.result == 'success' &&
      github.repository == 'protocol-works/lsdj' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the approved release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Download macOS producer bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: release-input/macos-arm64

      - name: Download Windows producer bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x64
          path: release-input/windows-x64

      - name: Verify complete required producer set
        env:
          LSDJ_RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_artifact.py verify \
            --input-root release-input \
            --required-producer macos-arm64 \
            --required-producer windows-x64 \
            --release-tag "$GITHUB_REF_NAME" \
            --revision "$LSDJ_RELEASE_REVISION" \
            --output-dir verified-release

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LSDJ_RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi

          mapfile -d '' -t RELEASE_FILES < <(
            find verified-release -maxdepth 1 -type f -print0 | sort -z
          )
          [[ "${#RELEASE_FILES[@]}" -gt 0 ]] || {
            echo "The verified release contains no files" >&2
            exit 1
          }

          DRAFT_RELEASE_ID=""
          PUBLISHED=0
          cleanup_draft() {
            result=$?
            if [[ -n "$DRAFT_RELEASE_ID" && "$PUBLISHED" -ne 1 ]]; then
              CLEANUP_JSON="$RUNNER_TEMP/lsdj-cleanup-release.json"
              if gh api \
                "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
                > "$CLEANUP_JSON" 2>/dev/null && \
                python scripts/release_artifact.py verify-draft-identity \
                  --release-json "$CLEANUP_JSON" \
                  --release-tag "$GITHUB_REF_NAME" \
                  --revision "$LSDJ_RELEASE_REVISION" \
                  --expected-release-id "$DRAFT_RELEASE_ID" >/dev/null; then
                echo "Publication failed; removing this run's unpublished draft" >&2
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" || \
                  echo "Could not remove this run's unpublished draft" >&2
              else
                echo "Could not prove this run still owns the failed draft; leaving it in place" >&2
              fi
            fi
            exit "$result"
          }
          trap cleanup_draft EXIT

          git fetch --no-tags origin \
            "+$GITHUB_REF:refs/remotes/origin/lsdj-release-tag"
          REMOTE_TAG_COMMIT="$(git rev-list -n 1 refs/remotes/origin/lsdj-release-tag)"
          [[ "$REMOTE_TAG_COMMIT" == "$LSDJ_RELEASE_REVISION" ]] || {
            echo "Release tag no longer resolves to the approved source revision" >&2
            exit 1
          }

          CREATE_RESPONSE="$RUNNER_TEMP/lsdj-created-release.json"
          SOURCE_MARKER="Source revision: $LSDJ_RELEASE_REVISION"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --field "tag_name=$GITHUB_REF_NAME" \
            --field "target_commitish=$LSDJ_RELEASE_REVISION" \
            --field "name=LSDJ $GITHUB_REF_NAME" \
            --field "body=$SOURCE_MARKER" \
            --field draft=true \
            --field generate_release_notes=true \
            > "$CREATE_RESPONSE"
          DRAFT_RELEASE_ID="$(python scripts/release_artifact.py \
            verify-draft-identity \
            --release-json "$CREATE_RESPONSE" \
            --release-tag "$GITHUB_REF_NAME" \
            --revision "$LSDJ_RELEASE_REVISION")"

          gh release upload "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY"

          RELEASE_JSON="$RUNNER_TEMP/lsdj-draft-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            > "$RELEASE_JSON"
          python scripts/release_artifact.py verify-github-release \
            --release-json "$RELEASE_JSON" \
            --verified-dir verified-release \
            --release-tag "$GITHUB_REF_NAME" \
            --revision "$LSDJ_RELEASE_REVISION" \
            --expected-release-id "$DRAFT_RELEASE_ID"

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            --field draft=false >/dev/null
          PUBLISHED=1
