[project]
name = "lsdj-backend"
version = "0.1.0"
description = "LSDJ backend: MRT2 deck workers behind a FastAPI WebSocket controller"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "magenta-rt[mlx]>=2.0.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
lsdj = "lsdj.controller:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
    "websockets>=14",
    # Freezes the inference sidecar for the native bundle (Phase 2 part 6;
    # scripts/freeze-sidecar.sh). A build tool, not a runtime dep.
    "pyinstaller>=6.21",
]
# Model runtimes are platform-specific, but most controller, transport, and
# validation tests are not. CI installs this locked group on every OS so those
# shared contracts stay testable without pretending that MLX is portable.
ci = [
    "fastapi>=0.136.3",
    "httpx>=0.27",
    "numpy>=2.2",
    "pytest>=8",
    "python-multipart>=0.0.32",
    "ruff>=0.8",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lsdj"]
